<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Agenda Profesional — Barbería System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/pages/barbero/mi-agenda.css">
</head>
<body>

    <div id="navbar-root"></div>

    <div class="container">

        <!-- Navegación de fecha -->
        <div class="date-nav">
            <div class="date-arrow" onclick="cambiarDia(-1)" title="Día anterior">‹</div>
            <div class="date-display" onclick="document.getElementById('datePicker').click(); document.getElementById('datePicker').showPicker()">
                <div class="dia" id="diaLabel">—</div>
                <div class="fecha-str" id="fechaLabel">—</div>
            </div>
            <input type="date" id="datePicker" class="date-picker-hidden" onchange="irAFecha(this.value)">
            <div class="date-arrow" onclick="cambiarDia(1)" title="Día siguiente">›</div>
        </div>

        <!-- Quick stats -->
        <div class="quick-stats">
            <div class="qs-card qs-pending">
                <div class="qs-value" id="qsPendientes">—</div>
                <div class="qs-label">Pendientes</div>
            </div>
            <div class="qs-card qs-confirm">
                <div class="qs-value" id="qsConfirmadas">—</div>
                <div class="qs-label">Confirmadas</div>
            </div>
            <div class="qs-card qs-done">
                <div class="qs-value" id="qsCompletadas">—</div>
                <div class="qs-label">Completadas</div>
            </div>
            <div class="qs-card qs-cancel">
                <div class="qs-value" id="qsCanceladas">—</div>
                <div class="qs-label">Canceladas</div>
            </div>
        </div>

        <!-- Agenda -->
        <div class="agenda-section">
            <div class="agenda-header">
                <h2>Citas Programadas</h2>
                <span class="citas-count" id="citasCount">Cargando...</span>
            </div>
            <div id="citasContainer">
                <div class="empty-state">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    </div>
                    Cargando citas...
                </div>
            </div>
        </div>

    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/navbar.js"></script>
    <script src="../../js/pages/barbero/mi-agenda.js"></script>
</body>
</html>
