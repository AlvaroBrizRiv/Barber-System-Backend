<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Barbería System — Inicia sesión para gestionar tus citas y acceder a tu cuenta.">
    <title>Barbería System — Iniciar Sesión</title>

    <!-- Fuentes premium de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <!--
        CSS Externos separados por responsabilidad:
        1. global.css  → Variables, reset, botones, navbar (compartido por toda la app)
        2. login.css   → Estilos específicos de las páginas de autenticación
    -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon">✂️</div>
                <h1>BARBERÍA</h1>
                <p>SYSTEM</p>
            </div>

            <div class="alert" id="alertaError" role="alert"></div>

            <form id="formLogin" novalidate>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.cl"
                           autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    INICIAR SESIÓN
                </button>
            </form>

            <div class="divider">o</div>

            <div class="register-link">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate gratis</a>
            </div>

            <div class="back-link">
                <a href="../index.html">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
