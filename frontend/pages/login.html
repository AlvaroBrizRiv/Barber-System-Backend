<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' http://localhost:7070 http://127.0.0.1:7070 https:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="Barbería System — Inicia sesión para gestionar tus citas y acceder a tu cuenta.">
    <title>Barbería System — Iniciar Sesión</title>

    <!-- Fuentes premium de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">

    <!--
        CSS Externos separados por responsabilidad:
        1. global.css  → Variables, reset, botones, navbar (compartido por toda la app)
        2. login.css   → Estilos específicos de las páginas de autenticación
    -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></div>
                <h1>Barber System</h1>
                <p id="loginSub">Entra para reservar y ver tus citas</p>
            </div>

            <div class="alert error" id="alertaError" role="alert" aria-live="polite"></div>

            <form id="formLogin" novalidate>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.cl"
                           autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••"
                           autocomplete="current-password" required>
                </div>

                <div class="forgot-link">
                    <a href="recuperar.html" id="linkRecuperar">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    Entrar
                </button>
            </form>

            <div class="divider">o</div>

            <div class="register-link">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate gratis</a>
            </div>

            <div class="back-link">
                <a href="../index.html">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
