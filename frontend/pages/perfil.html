<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' http://localhost:7070 http://127.0.0.1:7070 https:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Mi Perfil — Barber System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/perfil.css">
</head>
<body>
<div id="navbar-root"></div>

<main class="perfil-main">
    <div id="msgBox" class="msg-alert"></div>

    <div class="perfil-header">
        <div class="perfil-avatar-wrap" id="avatarContainer">
            <div class="perfil-avatar-inicial" id="avatarInicial">U</div>
        </div>
        <div class="perfil-info">
            <div class="perfil-nombre" id="perfilNombre">Cargando...</div>
            <div class="perfil-email" id="perfilEmail"></div>
            <div class="perfil-badges">
                <span class="badge badge-rol" id="perfilRol">CLIENTE</span>
                <span class="badge badge-puntos" id="perfilPuntos" style="display:none;">0 pts fidelidad</span>
            </div>
        </div>
    </div>

    <!-- Formulario de Edición -->
    <div class="perfil-card">
        <div class="perfil-card-titulo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Información Personal
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" id="fNombre" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Apellido</label>
                <input type="text" id="fApellido" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" id="fEmail" class="form-input" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" id="fTelefono" class="form-input" placeholder="+569...">
            </div>
            <div class="form-group full">
                <label class="form-label">URL Foto de Perfil</label>
                <input type="url" id="fFotoUrl" class="form-input" placeholder="https://ejemplo.com/mifoto.jpg">
                <div class="foto-preview-wrap">
                    <img id="fotoPreview" class="foto-preview" alt="preview">
                    <span style="font-size:0.75rem; color:var(--text3);">Vista previa de imagen</span>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Idioma Preferido</label>
                <select id="fIdioma" class="form-input">
                    <option value="es">Español (ES)</option>
                    <option value="pt-BR">Português (BR)</option>
                </select>
            </div>
        </div>

        <button class="btn-guardar" id="btnGuardar" onclick="guardarPerfil()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Guardar Cambios
        </button>
    </div>


    <!-- Zona de peligro: eliminar cuenta (solo clientes) -->
    <div class="perfil-card zona-peligro" id="zonaPeligro" hidden>
        <div class="perfil-card-titulo peligro-titulo">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            Eliminar mi cuenta
        </div>
        <p class="peligro-texto">
            Se cancelarán tus citas futuras, se vaciará tu carrito y se borrarán tus datos personales.
            Esta acción no se puede deshacer.
        </p>
        <form id="formEliminarCuenta" class="peligro-form" autocomplete="off">
            <label class="form-label" for="fPasswordEliminar">Confirma con tu contraseña</label>
            <input type="password" id="fPasswordEliminar" class="form-input" autocomplete="current-password" required maxlength="72">
            <label class="peligro-check">
                <input type="checkbox" id="fConfirmarEliminar" required>
                Entiendo que mi cuenta se eliminará de forma permanente.
            </label>
            <button type="submit" class="btn-eliminar" id="btnEliminarCuenta">Eliminar cuenta</button>
        </form>
    </div>
</main>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/pages/perfil.js"></script>
</body>
</html>
