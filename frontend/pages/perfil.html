<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Barber System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/perfil.css">
</head>
<body>
<div id="navbar-root"></div>

<main class="perfil-main">
    <div id="msgBox" class="msg-alert"></div>

    <div class="perfil-header">
        <div class="perfil-avatar-wrap" id="avatarContainer">
            <div class="perfil-avatar-inicial" id="avatarInicial">U</div>
        </div>
        <div class="perfil-info">
            <div class="perfil-nombre" id="perfilNombre">Cargando...</div>
            <div class="perfil-email" id="perfilEmail"></div>
            <div class="perfil-badges">
                <span class="badge badge-rol" id="perfilRol">CLIENTE</span>
                <span class="badge badge-puntos" id="perfilPuntos" style="display:none;">0 pts fidelidad</span>
            </div>
        </div>
    </div>

    <!-- Formulario de Edición -->
    <div class="perfil-card">
        <div class="perfil-card-titulo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Información Personal
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" id="fNombre" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Apellido</label>
                <input type="text" id="fApellido" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" id="fEmail" class="form-input" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" id="fTelefono" class="form-input" placeholder="+569...">
            </div>
            <div class="form-group full">
                <label class="form-label">URL Foto de Perfil</label>
                <input type="url" id="fFotoUrl" class="form-input" placeholder="https://ejemplo.com/mifoto.jpg">
                <div class="foto-preview-wrap">
                    <img id="fotoPreview" class="foto-preview" alt="preview">
                    <span style="font-size:0.75rem; color:var(--text3);">Vista previa de imagen</span>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Idioma Preferido</label>
                <select id="fIdioma" class="form-input">
                    <option value="es">Español (ES)</option>
                    <option value="pt-BR">Português (BR)</option>
                </select>
            </div>
        </div>

        <button class="btn-guardar" id="btnGuardar" onclick="guardarPerfil()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Guardar Cambios
        </button>
    </div>

    <!-- Suscripciones Disponibles -->
    <div class="perfil-card" id="seccionSuscripciones">
        <div class="perfil-card-titulo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
            Planes de Suscripción & Membresías
        </div>
        <div class="subs-grid" id="contenedorSubs">
            <p style="color:var(--text3); font-size:0.85rem;">Cargando planes disponibles...</p>
        </div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/pages/perfil.js"></script>
</body>
</html>
