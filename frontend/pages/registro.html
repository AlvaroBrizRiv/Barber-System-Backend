<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Barbería System — Crea tu cuenta y comienza a agendar citas en tu barbería favorita.">
    <title>Barbería System — Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <div class="registro-container">
        <div class="registro-card">
            <div class="brand">
                <div style="font-size:2rem;">✂️</div>
                <h1>BARBERÍA SYSTEM</h1>
                <p>CREA TU CUENTA</p>
                <p class="subtitle-reg">Regístrate gratis y agenda tu primera cita</p>
            </div>

            <div class="alert error" id="alertaError"></div>
            <div class="alert success" id="alertaExito"></div>

            <form id="formRegistro" novalidate>
                <div class="row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Álvaro" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" placeholder="Briz" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <!-- Campo: documento de identidad. El backend espera 'documentoIdentidad' (multi-país) -->
                        <label for="rut">Documento de Identidad (RUT)</label>
                        <input type="text" id="rut" placeholder="12345678-9" required>
                        <p class="hint">Con dígito verificador</p>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="+56912345678">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.cl" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <p class="hint" id="strengthText">La contraseña debe tener al menos 8 caracteres</p>
                </div>

                <div class="form-group">
                    <label for="confirmar">Confirmar Contraseña</label>
                    <input type="password" id="confirmar" placeholder="Repite tu contraseña" required>
                </div>

                <button type="submit" class="btn-registro" id="btnRegistro">
                    CREAR MI CUENTA
                </button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pages/registro.js"></script>
</body>
</html>
