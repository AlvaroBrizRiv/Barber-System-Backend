<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' http://localhost:7070 http://127.0.0.1:7070 https:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="Barbería System — Crea tu cuenta y comienza a agendar citas en tu barbería favorita.">
    <title>Barbería System — Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <div class="registro-container">
        <div class="registro-card">
            <div class="brand">
                <div class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></div>
                <h1>Crea tu cuenta</h1>
                <p>CREA TU CUENTA</p>
                <p class="subtitle-reg">Regístrate gratis y agenda tu primera cita</p>
            </div>

            <div class="alert error" id="alertaError" role="alert"></div>
            <div class="alert success" id="alertaExito" role="status"></div>

            <form id="formRegistro" novalidate>
                <div class="row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej: Camila" autocomplete="given-name" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" placeholder="Ej: Rojas" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <!-- Campo: documento de identidad. El backend espera 'documentoIdentidad' (multi-país) -->
                        <label for="rut">Documento de Identidad (RUT)</label>
                        <input type="text" id="rut" placeholder="12345678-9" autocomplete="off" aria-describedby="rutHint" required>
                        <p class="hint" id="rutHint">Con dígito verificador. Lo usa la barbería para identificar tus citas.</p>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="+56912345678" autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.cl" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" aria-describedby="strengthText" required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <p class="hint" id="strengthText" aria-live="polite">La contraseña debe tener al menos 8 caracteres</p>
                </div>

                <div class="form-group">
                    <label for="confirmar">Confirmar Contraseña</label>
                    <input type="password" id="confirmar" placeholder="Repite tu contraseña" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-registro" id="btnRegistro">
                    Crear mi cuenta
                </button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pages/registro.js"></script>
</body>
</html>
